[project]
name = "anki-activitywatch"
version = "1.0.0"
description = "Anki add-on that tells ActivityWatch which deck you are working in."
requires-python = ">=3.13,<3.14"
license = "MIT"

[dependency-groups]
dev = [
    "anki==26.9.4",
    "aqt==26.9.4",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
